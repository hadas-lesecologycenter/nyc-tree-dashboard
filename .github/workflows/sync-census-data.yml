name: Sync Census Data

on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Sync census data
        run: python scripts/sync-census.py
      
      - name: Check if census.json changed
        id: check_changes
        run: |
          if git diff --quiet data/census.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Tree Census Bot"
          git config user.email "bot@lesecologycenter.org"
          git add data/census.json
          git commit -m "chore: update census data from NYC Parks API"
          git push
      
      - name: Report status
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "✓ Census data updated and pushed"
          else
            echo "ℹ No changes to census data"
          fi

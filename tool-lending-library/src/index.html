<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Library</title>
  <style>
    :root {
      --green:       #2E7D32;
      --green-mid:   #388E3C;
      --green-light: #E8F5E9;
      --orange:      #E65100;
      --orange-light:#FFF3E0;
      --yellow:      #F57F17;
      --yellow-light:#FFF8E1;
      --red:         #C62828;
      --red-light:   #FFEBEE;
      --gray:        #546E7A;
      --gray-light:  #ECEFF1;
      --bg:          #F3F7F3;
      --card:        #FFFFFF;
      --text:        #1A1A1A;
      --muted:       #6B7280;
      --border:      #E0E0E0;
      --radius:      12px;
      --shadow:      0 1px 6px rgba(0,0,0,0.08);
      --shadow-lg:   0 6px 24px rgba(0,0,0,0.13);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      color: white;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .header-icon { font-size: 34px; line-height: 1; }
    .header-title { font-size: 22px; font-weight: 700; }
    .header-sub   { font-size: 13px; opacity: 0.8; margin-top: 2px; }

    /* ── Tabs ── */
    .tabs {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .tab {
      padding: 15px 22px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .tab.active  { color: var(--green); border-bottom-color: var(--green); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Content ── */
    .page { display: none; padding: 24px 28px; max-width: 1180px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .input-field {
      padding: 10px 14px;
      border: 1.5px solid #C8E6C9;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--text);
    }
    .input-field:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,125,50,0.12); }
    #search { flex: 1; min-width: 200px; }

    /* ── Tool grid ── */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    /* ── Tool card ── */
    .tool-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .tool-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
    .tool-card.dim   { opacity: 0.65; }

    .tool-photo {
      width: 100%;
      height: 155px;
      background: #F1F8E9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tool-photo img {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
    }

    .tool-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
    .tool-name { font-size: 15px; font-weight: 700; margin-bottom: 9px; line-height: 1.3; }

    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .badge {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .b-available   { background: var(--green-light);  color: var(--green); }
    .b-borrowed    { background: var(--orange-light); color: var(--orange); }
    .b-maintenance { background: var(--yellow-light); color: var(--yellow); }
    .b-retired     { background: var(--gray-light);   color: var(--gray); }
    .b-excellent   { background: #E8F5E9; color: #2E7D32; }
    .b-good        { background: #F1F8E9; color: #388E3C; }
    .b-fair        { background: #FFFDE7; color: #F9A825; }
    .b-poor        { background: #FFF3E0; color: #BF360C; }
    .b-broken      { background: #FFEBEE; color: #C62828; }
    .b-cat         { background: #E3F2FD; color: #1565C0; }
    .b-qty-ok      { background: #E8F5E9; color: #1B5E20; font-size: 12px; }
    .b-qty-low     { background: #FFF8E1; color: #E65100; font-size: 12px; }
    .b-qty-none    { background: #FFEBEE; color: #B71C1C; font-size: 12px; }

    .tool-detail {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .spacer { flex: 1; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-green  { background: var(--green); color: white; }
    .btn-green:hover { background: #1B5E20; box-shadow: 0 3px 10px rgba(46,125,50,0.35); }
    .btn-outline { background: white; color: var(--green); border: 2px solid var(--green); }
    .btn-outline:hover { background: var(--green-light); }
    .btn-block { display: flex; width: 100%; margin-top: 10px; }
    .btn:disabled { background: #BDBDBD !important; color: white !important; cursor: not-allowed; box-shadow: none; transform: none; border-color: transparent; }

    /* ── Return section ── */
    .return-box {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      max-width: 540px;
    }
    .return-box h2 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
    .return-box p  { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

    .search-row { display: flex; gap: 10px; }
    .search-row .input-field { flex: 1; }
    .search-row .btn { white-space: nowrap; }

    .loan-list { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .loan-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .loan-info h3 { font-size: 15px; font-weight: 700; }
    .loan-info p  { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .loan-overdue { color: var(--red); font-weight: 600; }
    .loan-id      { font-size: 11px; color: #9E9E9E; margin-top: 4px; }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; animation: fade-in 0.18s ease; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slide-up 0.2s ease;
    }
    @keyframes slide-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal h2      { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .modal-sub     { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .modal-tool    { font-weight: 600; color: var(--green); }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .field .input-field { width: 100%; }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .modal-actions .btn { flex: 1; }

    /* Condition picker */
    .cond-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 6px;
    }
    .cond-btn {
      padding: 9px 4px;
      border: 2px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .cond-btn:hover       { border-color: var(--green); }
    .cond-btn.selected    { border-color: var(--green); background: var(--green-light); color: var(--green); }
    .cond-excellent.selected { border-color:#2E7D32; background:#E8F5E9; color:#2E7D32; }
    .cond-good.selected      { border-color:#388E3C; background:#F1F8E9; color:#388E3C; }
    .cond-fair.selected      { border-color:#F9A825; background:#FFFDE7; color:#F57F17; }
    .cond-poor.selected      { border-color:#E65100; background:#FFF3E0; color:#E65100; }
    .cond-broken.selected    { border-color:#C62828; background:#FFEBEE; color:#C62828; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 13px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: #1A1A1A;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    .toast.show    { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #2E7D32; }
    .toast.error   { background: #C62828; }

    /* ── Loading / empty states ── */
    .loading, .empty {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 38px; height: 38px;
      border: 4px solid #E8F5E9;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header { padding: 16px 18px; }
      .header-title { font-size: 18px; }
      .tabs  { padding: 0 12px; }
      .tab   { padding: 12px 14px; font-size: 13px; }
      .page  { padding: 16px; }
      .cond-grid { grid-template-columns: repeat(3, 1fr); }
      .tool-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-icon">🔧</div>
  <div>
    <div class="header-title" id="org-name">Tool Library</div>
    <div class="header-sub">Browse available tools and manage your loans</div>
  </div>
</header>

<!-- Tabs -->
<nav class="tabs">
  <div class="tab active" data-page="browse">🗂️ Browse &amp; Borrow</div>
  <div class="tab"        data-page="return">📥 Return a Tool</div>
</nav>

<!-- ── Browse & Borrow ── -->
<div class="page active" id="browse">
  <div class="filters">
    <input  class="input-field" id="search"     placeholder="🔍  Search tools…" oninput="filterTools()">
    <select class="input-field" id="cat-filter" onchange="filterTools()">
      <option value="">All Categories</option>
    </select>
    <select class="input-field" id="status-filter" onchange="filterTools()">
      <option value="">All Tools</option>
      <option value="Available">Available Only</option>
    </select>
  </div>
  <div class="tool-grid" id="tool-grid">
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>Loading tools…
    </div>
  </div>
</div>

<!-- ── Return a Tool ── -->
<div class="page" id="return">
  <div class="return-box">
    <h2>Return a Tool</h2>
    <p>Enter the name or email address you used when borrowing and we'll find your active loans.</p>
    <div class="search-row">
      <input class="input-field" type="text" id="lookup-input"
             placeholder="Your name or email…"
             onkeydown="if(event.key==='Enter') lookupLoans()">
      <button class="btn btn-green" onclick="lookupLoans()">Find My Loans</button>
    </div>
  </div>
  <div class="loan-list" id="loan-list"></div>
</div>

<!-- ── Checkout Modal ── -->
<div class="overlay" id="checkout-overlay">
  <div class="modal">
    <h2>Borrow a Tool</h2>
    <div class="modal-sub">Borrowing: <span class="modal-tool" id="checkout-tool-label"></span></div>

    <div class="field">
      <label>Full Name *</label>
      <input class="input-field" type="text" id="co-name" placeholder="Jane Smith" autocomplete="name">
    </div>
    <div class="field">
      <label>Email Address *</label>
      <input class="input-field" type="email" id="co-email" placeholder="jane@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input class="input-field" type="tel" id="co-phone" placeholder="optional" autocomplete="tel">
    </div>
    <div class="field" id="co-qty-wrap" style="display:none">
      <label>Quantity <span id="co-qty-max" style="font-weight:400;text-transform:none"></span></label>
      <input class="input-field" type="number" id="co-qty" min="1" value="1">
    </div>
    <div class="field">
      <label>Return By *</label>
      <input class="input-field" type="date" id="co-due">
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeOverlay('checkout-overlay')">Cancel</button>
      <button class="btn btn-green"   id="co-submit" onclick="submitCheckout()">Confirm Checkout</button>
    </div>
  </div>
</div>

<!-- ── Return Condition Modal ── -->
<div class="overlay" id="return-overlay">
  <div class="modal">
    <h2>Return Tool</h2>
    <div class="modal-sub">Returning: <span class="modal-tool" id="return-tool-label"></span></div>

    <div class="field">
      <label>Condition when returning *</label>
      <div class="cond-grid" id="cond-grid"></div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>Notes (optional)</label>
      <input class="input-field" type="text" id="return-notes" placeholder="Damage, issues, anything to mention…">
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeOverlay('return-overlay')">Cancel</button>
      <button class="btn btn-green"   id="ret-submit" onclick="submitReturn()">Confirm Return</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

const CONDITIONS = ['Excellent', 'Good', 'Fair', 'Poor', 'Broken'];

let catalog      = [];    // all tools from server
let loanDays     = 14;
let pendingTool  = null;  // { id, name } for checkout
let pendingReturn = null; // { toolId, toolName } for return

// ── Init ──────────────────────────────────────────────────────────────────────

window.addEventListener('load', () => {
  // Build condition picker buttons
  const grid = document.getElementById('cond-grid');
  CONDITIONS.forEach(c => {
    const btn = document.createElement('div');
    btn.className   = 'cond-btn cond-' + c.toLowerCase();
    btn.textContent = c;
    btn.dataset.val = c;
    btn.addEventListener('click', () => pickCondition(c));
    grid.appendChild(btn);
  });

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchPage(tab.dataset.page));
  });

  // Close modals on backdrop click
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
  });

  loadCatalog();
});

function switchPage(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === id));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
}

// ── Catalog ───────────────────────────────────────────────────────────────────

function loadCatalog() {
  google.script.run
    .withSuccessHandler(onCatalogLoaded)
    .withFailureHandler(err => gridHTML(
      '<div class="empty"><div class="empty-icon">⚠️</div><p>' + esc(err.message) + '</p></div>'
    ))
    .getToolCatalog();
}

function onCatalogLoaded(data) {
  catalog  = data.tools;
  loanDays = data.loanDays;

  document.getElementById('org-name').textContent = data.orgName;
  document.title = data.orgName;

  // Set default due date
  const due = new Date();
  due.setDate(due.getDate() + loanDays);
  document.getElementById('co-due').valueAsDate = due;

  // Populate category filter
  const catSel = document.getElementById('cat-filter');
  const cats   = [...new Set(catalog.map(t => t.category).filter(Boolean))].sort();
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });

  renderTools(catalog);
}

function filterTools() {
  const q   = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sts = document.getElementById('status-filter').value;
  renderTools(catalog.filter(t =>
    (!q   || t.name.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q)) &&
    (!cat || t.category === cat) &&
    (!sts || t.status  === sts)
  ));
}

function renderTools(tools) {
  if (!tools.length) {
    gridHTML('<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>No tools match your search.</p></div>');
    return;
  }
  // Available tools first, then alphabetically
  const sorted = [...tools].sort((a, b) => {
    if (a.status === 'Available' && b.status !== 'Available') return -1;
    if (a.status !== 'Available' && b.status === 'Available') return  1;
    return a.name.localeCompare(b.name);
  });
  gridHTML(sorted.map(toolCardHTML).join(''));
}

function gridHTML(html) {
  document.getElementById('tool-grid').innerHTML = html;
}

function toolCardHTML(t) {
  const canBorrow = t.availQty > 0 && t.status !== 'Maintenance' && t.status !== 'Retired';
  const sCls      = 'b-' + t.status.toLowerCase().replace(/\s+/g, '-');
  const cCls      = 'b-' + t.condition.toLowerCase();
  const photoEl   = t.photoUrl
    ? `<img src="${esc(t.photoUrl)}" alt="${esc(t.name)}" loading="lazy" onerror="this.parentElement.innerHTML='🔧'">`
    : '🔧';

  // Quantity label
  let qtyCls, qtyLabel;
  if (t.status === 'Maintenance' || t.status === 'Retired') {
    qtyCls = 'b-qty-none'; qtyLabel = t.status;
  } else if (t.availQty === 0) {
    qtyCls = 'b-qty-none'; qtyLabel = 'All borrowed';
  } else if (t.availQty === 1) {
    qtyCls = 'b-qty-low';  qtyLabel = 'Last one!';
  } else {
    qtyCls = 'b-qty-ok';   qtyLabel = t.availQty + ' of ' + t.totalQty + ' available';
  }

  const btnText = canBorrow ? '📤 Borrow This Tool'
                : t.status === 'Borrowed' || t.availQty === 0 ? '⏳ All Units Borrowed'
                : t.status === 'Maintenance' ? '🔨 In Maintenance'
                : '🚫 Unavailable';

  return `
    <div class="tool-card ${canBorrow ? '' : 'dim'}">
      <div class="tool-photo">${photoEl}</div>
      <div class="tool-body">
        <div class="tool-name">${esc(t.name)}</div>
        <div class="badges">
          <span class="badge ${qtyCls}">${qtyLabel}</span>
          <span class="badge ${cCls}">${t.condition}</span>
          <span class="badge b-cat">${esc(t.category)}</span>
        </div>
        ${t.location ? `<div class="tool-detail">📍 <span>${esc(t.location)}</span></div>` : ''}
        ${t.notes    ? `<div class="tool-detail">📝 <span>${esc(t.notes)}</span></div>`    : ''}
        <div class="spacer"></div>
        <button class="btn btn-block ${canBorrow ? 'btn-green' : ''}"
                ${canBorrow ? `onclick="openCheckout('${esc(t.id)}','${esc(t.name)}',${t.availQty})"` : 'disabled'}>
          ${btnText}
        </button>
      </div>
    </div>`;
}

// ── Checkout ──────────────────────────────────────────────────────────────────

function openCheckout(toolId, toolName, availQty) {
  pendingTool = { id: toolId, name: toolName, availQty };
  document.getElementById('checkout-tool-label').textContent = toolName;
  ['co-name','co-email','co-phone'].forEach(id => document.getElementById(id).value = '');

  // Show/hide qty field based on availability
  const qtyWrap = document.getElementById('co-qty-wrap');
  const qtyInput = document.getElementById('co-qty');
  if (availQty > 1) {
    qtyWrap.style.display = 'block';
    qtyInput.max   = availQty;
    qtyInput.value = 1;
    document.getElementById('co-qty-max').textContent = availQty + ' available';
  } else {
    qtyWrap.style.display = 'none';
    qtyInput.value = 1;
  }

  const due = new Date(); due.setDate(due.getDate() + loanDays);
  document.getElementById('co-due').valueAsDate = due;
  openOverlay('checkout-overlay');
}

function submitCheckout() {
  const name  = document.getElementById('co-name').value.trim();
  const email = document.getElementById('co-email').value.trim();
  const phone = document.getElementById('co-phone').value.trim();
  const due   = document.getElementById('co-due').value;

  if (!name)  { toast('Please enter your name.',           'error'); return; }
  if (!email) { toast('Please enter your email address.',  'error'); return; }
  if (!due)   { toast('Please choose a return date.',      'error'); return; }

  const btn = document.getElementById('co-submit');
  setLoading(btn, true, 'Processing…');

  google.script.run
    .withSuccessHandler(res => {
      setLoading(btn, false, 'Confirm Checkout');
      if (res.success) {
        closeOverlay('checkout-overlay');
        toast(`✅ Checked out! Loan ID: ${res.loanId}. Check your email for confirmation.`, 'success');
        loadCatalog();
      } else {
        toast('❌ ' + res.error, 'error');
      }
    })
    .withFailureHandler(err => {
      setLoading(btn, false, 'Confirm Checkout');
      toast('❌ ' + err.message, 'error');
    })
    .submitCheckoutRequest({
      toolId: pendingTool.id, name, email, phone, dueDate: due,
      qty: parseInt(document.getElementById('co-qty').value) || 1,
    });
}

// ── Return ────────────────────────────────────────────────────────────────────

function lookupLoans() {
  const contact = document.getElementById('lookup-input').value.trim();
  if (!contact) { toast('Please enter your name or email.', 'error'); return; }

  const list = document.getElementById('loan-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Looking up loans…</div>';

  google.script.run
    .withSuccessHandler(loans => {
      if (!loans.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>No active loans found for that name or email.</p></div>';
        return;
      }
      const now = new Date();
      list.innerHTML = loans.map(l => {
        const isOverdue = l.status === 'Overdue';
        return `
          <div class="loan-card">
            <div class="loan-info">
              <h3>${esc(l.toolName)}</h3>
              <p>Qty: ${l.qty} &nbsp;·&nbsp; Borrowed: ${l.borrowDate} &nbsp;·&nbsp;
                 <span class="${isOverdue ? 'loan-overdue' : ''}">Due: ${l.dueDate}${isOverdue ? ' ⚠️' : ''}</span>
              </p>
              <div class="loan-id">Loan ID: ${l.loanId}</div>
            </div>
            <button class="btn btn-outline"
              onclick="openReturn('${esc(l.toolId)}','${esc(l.toolName)}')">
              Return
            </button>
          </div>`;
      }).join('');
    })
    .withFailureHandler(err => {
      list.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>${esc(err.message)}</p></div>`;
    })
    .lookupActiveLoans(contact);
}

function openReturn(toolId, toolName) {
  pendingReturn = { toolId, toolName, condition: null };
  document.getElementById('return-tool-label').textContent = toolName;
  document.getElementById('return-notes').value = '';
  document.querySelectorAll('.cond-btn').forEach(b => b.classList.remove('selected'));
  openOverlay('return-overlay');
}

function pickCondition(c) {
  pendingReturn.condition = c;
  document.querySelectorAll('.cond-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.val === c);
  });
}

function submitReturn() {
  if (!pendingReturn.condition) { toast('Please select the tool condition.', 'error'); return; }

  const btn   = document.getElementById('ret-submit');
  const notes = document.getElementById('return-notes').value.trim();
  const contact = document.getElementById('lookup-input').value.trim();
  const isEmail = contact.includes('@');

  setLoading(btn, true, 'Processing…');

  google.script.run
    .withSuccessHandler(res => {
      setLoading(btn, false, 'Confirm Return');
      if (res.success) {
        closeOverlay('return-overlay');
        toast(`✅ ${res.toolName} returned — thank you!`, 'success');
        lookupLoans();
        loadCatalog();
      } else {
        toast('❌ ' + res.error, 'error');
      }
    })
    .withFailureHandler(err => {
      setLoading(btn, false, 'Confirm Return');
      toast('❌ ' + err.message, 'error');
    })
    .submitReturnRequest({
      toolId:    pendingReturn.toolId,
      condition: pendingReturn.condition,
      notes,
      name:  isEmail ? '' : contact,
      email: isEmail ? contact : '',
    });
}

// ── Overlays ──────────────────────────────────────────────────────────────────

function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

// ── Toast ─────────────────────────────────────────────────────────────────────

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show ' + (type || '');
  setTimeout(() => el.classList.remove('show'), 4500);
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function setLoading(btn, loading, label) {
  btn.disabled    = loading;
  btn.textContent = loading ? label : btn.dataset.orig || label;
  if (!loading) btn.dataset.orig = label;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
